# Weekly PRs; CI builds, smoke-tests and scans each one before merge.
# Cooldown: skip releases younger than 7 days (time for yanks of compromised versions).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(go)'
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(docker)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(actions)'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /crowdsec
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(crowdsec)'
