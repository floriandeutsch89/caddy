# Weekly PRs; CI builds, smoke-tests and scans each one before merge.
# Cooldown: skip releases younger than 7 days (time for yanks of compromised versions).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(go)'
    groups:
      go-modules:
        patterns: ['*']
    ignore:
      # caddy-crowdsec-bouncer v0.14.1 does not compile against crowdsec >= 1.7
      # (API change). The bouncer release that supports it brings it along;
      # drop this then (CVE-2026-44982, see SECURITY.md).
      - dependency-name: github.com/crowdsecurity/crowdsec
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(docker)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(actions)'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /crowdsec
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(crowdsec)'
  # Pinned helpers in the example (socket proxy, Watchtower); caddy/crowdsec stay on :latest.
  - package-ecosystem: docker-compose
    directory: /examples
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps(compose)'
