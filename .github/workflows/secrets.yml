# Separate from ci.yml on purpose: runs on every change, docs included, because a
# key pasted into a README is still a leak. GitHub push protection (Settings ->
# Code security) blocks known token formats at push time; this is the net behind it.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # checkout only

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed later is still leaked
          persist-credentials: false
      - name: No secret files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|(^|/)id_(rsa|ed25519|ecdsa)$|online_api_credentials\.yaml$'; then
            echo "::error::secret-like file tracked (see above); remove it and rotate the secret"
            exit 1
          fi
      # Pinned image instead of gitleaks-action: no licence key, no token, same
      # binary as locally. Reviewed false positives go into .gitleaksignore.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --verbose --exit-code 1
