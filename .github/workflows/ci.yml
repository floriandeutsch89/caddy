# Lint, build, smoke-test and scan on every PR/push; publish to GHCR from main.
# Weekly run re-scans with fresh vulnerability data; base image fixes arrive as Dependabot digest PRs.
name: ci

# Docs-only pushes skip CI (they cannot change an image or the stack). PRs always run:
# required checks that never start would block the merge forever.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if no image input changed
        type: boolean
        default: false

permissions:
  contents: read # checkout only; publish widens its own job

# A newer push cancels the older run, publish included: the newer run publishes anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum # module + build cache: tidy/vet/govulncheck without re-downloading
      - name: go.mod tidy, gofmt, vet
        run: |
          go mod tidy -diff
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...
      # Reachability-aware; expiring exceptions in .govulncheck-ignore.
      - name: govulncheck
        run: scripts/govulncheck.sh
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.30.1 --offline --format=github .
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false
      - name: Terraform and cloud-init (infra/)
        run: |
          terraform -chdir=infra/terraform fmt -check -diff
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          head -1 infra/cloud-init.yaml | grep -qx '#cloud-config'
          python3 -c "import yaml; assert yaml.safe_load(open('infra/cloud-init.yaml'))['runcmd']"

  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Caddy version from go.mod
        id: version
        run: |
          v=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Caddy version '$v'"; exit 1; }
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: caddy:test
          # Separate scopes: amd64 (test, e2e) and multi-arch (publish) would overwrite each other.
          cache-from: type=gha,scope=amd64-caddy
          cache-to: type=gha,mode=max,scope=amd64-caddy

      - name: Smoke test
        env:
          WANT: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          run() { docker run --rm -v "$PWD:/repo:ro" --env-file test/validate.env caddy:test "$@"; }
          got=$(run caddy version | cut -d' ' -f1)
          [ "$got" = "$WANT" ] || { echo "::error::caddy version $got, go.mod says $WANT"; exit 1; }
          mods=$(run caddy list-modules)
          for m in http.handlers.crowdsec http.handlers.appsec dns.providers.acmedns http.handlers.rate_limit; do
            grep -qx "$m" <<<"$mods" || { echo "::error::module $m missing"; exit 1; }
          done
          [ "$(run id -u)" = 10001 ] || { echo "::error::image does not run as UID 10001"; exit 1; }
          run caddy validate --config /repo/test/Caddyfile --adapter caddyfile
          run caddy validate --config /repo/examples/config/Caddyfile --adapter caddyfile
          # Example with the opt-in wildcard site enabled.
          ex=$(mktemp -d) && cp -r examples/. "$ex" && chmod -R a+rX "$ex"
          cp "$ex/config/sites/wildcard.caddy.example" "$ex/config/sites/wildcard.caddy"
          docker run --rm -v "$ex:/ex:ro" --env-file test/validate.env caddy:test \
            caddy validate --config /ex/config/Caddyfile --adapter caddyfile
          # Hardened like the README example; non-root must still bind :80
          # (relies on Docker's unprivileged port range, not on capabilities).
          docker run -d --name smoke -p 8080:80 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 \
            caddy:test caddy respond --listen :80 ok
          for _ in $(seq 20); do curl -fsS http://127.0.0.1:8080 && break; sleep 0.5; done | grep -qx ok \
            || { docker logs smoke; echo "::error::container did not serve on :80"; exit 1; }
          docker rm -f smoke
          # Arbitrary UID in group 0 (OpenShift restricted SCC) must write the state dirs.
          docker run --rm --user 1000680000:0 caddy:test \
            sh -c 'touch /data/x /config/x /var/log/caddy/x' \
            || { echo "::error::arbitrary UID with GID 0 cannot write state dirs"; exit 1; }

  # Same job name as in pikdame-local: Dockerfile lint, image CVEs, Dockerfile misconfigurations.
  docker-security:
    name: docker-security (${{ matrix.image }}) # stable name for required checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: caddy
            context: .
            fail-on-cve: '1'
          # Upstream image: we cannot patch its CVEs, only bump the base. Report, don't block.
          - image: crowdsec
            context: crowdsec
            fail-on-cve: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.context }}/Dockerfile
      # Whole repo once: exceptions in .trivyignore.yaml match repo-relative paths.
      - name: Misconfiguration scan (all Dockerfiles)
        if: matrix.image == 'caddy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: '1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:test
          cache-from: type=gha,scope=amd64-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=amd64-${{ matrix.image }}
      # Fixable HIGH/CRITICAL only; accepted findings with expiry in .trivyignore.yaml.
      - name: Vulnerability scan (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: ${{ matrix.fail-on-cve }}

  # Full examples/ stack: routing, network isolation, CrowdSec detection and banning.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build caddy (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: caddy:test
          cache-from: type=gha,scope=amd64-caddy
      - name: Build crowdsec (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: crowdsec
          load: true
          tags: crowdsec:test
          cache-from: type=gha,scope=amd64-crowdsec
      - name: End-to-end test
        run: scripts/e2e.sh

  # Every push to main publishes :edge plus immutable tags. :latest moves only via
  # the promote workflow (or once, if it does not exist yet).
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, test, e2e, docker-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # inputs: every file that ends up in (or shapes) the image; its hash decides
          # whether there is anything new to publish.
          - image: caddy
            context: .
            licenses: Apache-2.0 AND MIT
            inputs: Dockerfile .dockerignore go.mod go.sum main.go
          - image: crowdsec
            context: crowdsec
            licenses: MIT
            inputs: crowdsec
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC for the Sigstore-signed attestation
      attestations: write # store the attestation
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upstream version
        id: version
        env:
          IMG: ${{ matrix.image }}
        run: |
          if [ "$IMG" = caddy ]; then
            v=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          else
            v=$(sed -n 's/^FROM crowdsecurity\/crowdsec:\(v[0-9.]*\)@.*/\1/p' crowdsec/Dockerfile)
          fi
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected $IMG version '$v'"; exit 1; }
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the published :edge -> nothing new, skip. Digests cannot tell
      # (timestamps, SBOM), so the input hash is stored as a label and compared.
      - name: Anything new to publish?
        id: gate
        env:
          INPUTS: ${{ matrix.inputs }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # INPUTS is a list of paths
          recipe=$(git ls-files -s -- $INPUTS | sha256sum | cut -d' ' -f1)
          published=$(docker buildx imagetools inspect "$IMAGE:edge" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.. | objects | .config? // empty | .Labels? // empty | ."io.github.floriandeutsch89.recipe"? // empty] | first // ""' || true)
          echo "recipe=$recipe" >> "$GITHUB_OUTPUT"
          echo "inputs: $recipe, published :edge: ${published:-none}"
          if [ "$recipe" = "$published" ] && [ "$FORCE" != true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### $IMAGE: unchanged, not published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Tags and labels
        if: steps.gate.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # :latest follows every tested main build unless the commit message says
          # [no-latest] (breaking change: update compose first, then promote).
          tags: |
            type=raw,value=edge
            type=raw,value=latest,enable=${{ !contains(github.event.head_commit.message, '[no-latest]') }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            io.github.floriandeutsch89.recipe=${{ steps.gate.outputs.recipe }}

      - name: Build & push (amd64 + arm64)
        if: steps.gate.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=multi-${{ matrix.image }}
            type=gha,scope=amd64-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=multi-${{ matrix.image }}

      - name: Attest build provenance
        if: steps.gate.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
