# Lint, build, smoke-test and scan on every PR/push; publish to GHCR from main.
# Weekly run re-scans with fresh vulnerability data; base image fixes arrive as Dependabot digest PRs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read # checkout only; publish widens its own job

# A newer push cancels the older run, publish included: the newer run publishes anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caddy

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: go.sum # module + build cache: tidy/vet/govulncheck without re-downloading
      - name: go.mod tidy, gofmt, vet
        run: |
          go mod tidy -diff
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
          go vet ./...
      # Reachability-aware; expiring exceptions in .govulncheck-ignore.
      - name: govulncheck
        run: scripts/govulncheck.sh
      - name: zizmor (workflow security)
        run: pipx run zizmor==1.30.1 --offline --format=github .

  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Caddy version from go.mod
        id: version
        run: |
          v=$(awk '$1 == "github.com/caddyserver/caddy/v2" { print $2 }' go.mod)
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Caddy version '$v'"; exit 1; }
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: caddy:test
          # Separate scopes: amd64 (test, e2e) and multi-arch (publish) would overwrite each other.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke test
        env:
          WANT: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          run() { docker run --rm -v "$PWD:/repo:ro" --env-file test/validate.env caddy:test "$@"; }
          got=$(run caddy version | cut -d' ' -f1)
          [ "$got" = "$WANT" ] || { echo "::error::caddy version $got, go.mod says $WANT"; exit 1; }
          mods=$(run caddy list-modules)
          for m in http.handlers.crowdsec dns.providers.acmedns http.handlers.rate_limit; do
            grep -qx "$m" <<<"$mods" || { echo "::error::module $m missing"; exit 1; }
          done
          [ "$(run id -u)" = 10001 ] || { echo "::error::image does not run as UID 10001"; exit 1; }
          run caddy validate --config /repo/test/Caddyfile --adapter caddyfile
          run caddy validate --config /repo/examples/Caddyfile --adapter caddyfile
          # Example with the opt-in wildcard site enabled.
          ex=$(mktemp -d) && cp -r examples/. "$ex" && chmod -R a+rX "$ex"
          cp "$ex/sites/wildcard.caddy.example" "$ex/sites/wildcard.caddy"
          docker run --rm -v "$ex:/ex:ro" --env-file test/validate.env caddy:test \
            caddy validate --config /ex/Caddyfile --adapter caddyfile
          # Hardened like the README example; non-root must still bind :80
          # (relies on Docker's unprivileged port range, not on capabilities).
          docker run -d --name smoke -p 8080:80 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /data:uid=10001,gid=10001 --tmpfs /config:uid=10001,gid=10001 \
            caddy:test caddy respond --listen :80 ok
          for _ in $(seq 20); do curl -fsS http://127.0.0.1:8080 && break; sleep 0.5; done | grep -qx ok \
            || { docker logs smoke; echo "::error::container did not serve on :80"; exit 1; }
          docker rm -f smoke

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  # Full examples/ stack: routing, network isolation, CrowdSec detection and banning.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: caddy:test
          cache-from: type=gha,scope=amd64
      - name: End-to-end test
        run: scripts/e2e.sh

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC for the Sigstore-signed attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.test.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.test.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.test.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.title=caddy
            org.opencontainers.image.licenses=Apache-2.0 AND MIT

      - name: Build & push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=multi
            type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=multi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
