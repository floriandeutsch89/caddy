# One Caddy for all sites; one internal network per app, so apps cannot reach each other.
services:
  # One-shot on every `up`: the log volume must be writable for Caddy (UID 10001) and
  # readable for CrowdSec. Docker only seeds a new volume from the first container
  # that mounts it, which may be CrowdSec (no such directory: root-owned volume).
  caddy-logs-init:
    image: ghcr.io/floriandeutsch89/caddy:latest
    user: "0:0"
    command: ["sh", "-c", "chmod 0750 /var/log/caddy && chown 10001:0 /var/log/caddy"]
    volumes:
      - caddy-logs:/var/log/caddy
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER] # chown, and chmod on a directory root does not own
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  caddy:
    image: ghcr.io/floriandeutsch89/caddy:latest # every tested main build (README)
    container_name: caddy # one per host: `docker logs caddy` from anywhere
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: .env
    volumes:
      # Directory, not single files: editors and sed -i replace files, and a
      # single-file bind mount would keep showing the old one to `caddy reload`.
      - ./config:/etc/caddy:ro
      - caddy-data:/data # certificates and ACME account: must persist
      - caddy-config:/config
      - caddy-logs:/var/log/caddy # access log for CrowdSec
    networks:
      # Default gateway: published ports and outbound traffic must not land on an
      # internal app network (Docker would pick one otherwise). Docker >= 28.
      caddy_egress: { gw_priority: 1 } # ACME, OCSP, CrowdSec LAPI
      caddy_app1: {}
      caddy_app2: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Sized for a few dozen low-traffic sites; raise memory first if Caddy gets OOM-killed.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          memory: 128M
    environment:
      GOMEMLIMIT: 460MiB # ~90% of the memory limit: Go GCs harder instead of being OOM-killed
    ulimits:
      nofile: { soft: 65536, hard: 65536 } # one fd per open connection
    stop_grace_period: 30s # let in-flight requests finish on restart
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" } # otherwise logs grow until the disk is full
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      caddy-logs-init:
        condition: service_completed_successfully
      crowdsec:
        # Wait for CrowdSec, but start anyway if it never gets healthy: sites must not
        # go down because of CrowdSec (the bouncer fails open and reconnects).
        condition: service_healthy
        required: false
    labels: [com.centurylinklabs.watchtower.enable=true] # follows :latest

  # Detects attacks in Caddy's access log and shares bans with the bouncer in Caddy.
  # If it is down, Caddy keeps serving (fail-open), just without blocking.
  crowdsec:
    # Collections and log acquisition are baked in (crowdsec/ in this repo).
    image: ghcr.io/floriandeutsch89/crowdsec:latest # every tested main build (README)
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # Registers Caddy's bouncer key on start; no cscli step needed.
      BOUNCER_KEY_caddy: ${CROWDSEC_API_KEY:?set CROWDSEC_API_KEY in .env}
    volumes:
      - crowdsec-config:/etc/crowdsec # also holds the Central API registration: must persist
      - crowdsec-data:/var/lib/crowdsec/data
      - caddy-logs:/var/log/caddy:ro
    networks: [caddy_egress] # hub updates + community blocklist; Caddy reaches the LAPI here
    depends_on:
      caddy-logs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      start_period: 90s # first start installs the hub collections
    # Runs as root (upstream entrypoint), but without capabilities root cannot bypass
    # file permissions: it reads Caddy's log via group 10001 (old files) or 0 (new).
    group_add: ["10001"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M, pids: 128 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels: [com.centurylinklabs.watchtower.enable=true]

  # Docker API for Watchtower only, reduced to what it needs. Still powerful: whoever
  # can create containers through it controls the host, so only Watchtower reaches it.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # list, inspect, recreate
      IMAGES: 1 # pull, remove old
      NETWORKS: 1 # reattach networks on recreate
      POST: 1 # write access for the sections above
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket_proxy]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 64 }
    logging: &small-logs
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Daily check for new :latest images of labeled containers (Caddy, CrowdSec).
  # :latest moves only after green CI on main (README), so this deploys tested builds.
  watchtower:
    image: nickfedor/watchtower:1.23.0@sha256:45b54f6dc15227cfb38dbb826f2881aa0f56aaf0c255cdbb38bd80e598bdca9a
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      WATCHTOWER_LABEL_ENABLE: "true" # only containers with the label
      WATCHTOWER_CLEANUP: "true" # remove replaced images
      WATCHTOWER_SCHEDULE: "0 0 4 * * *" # 04:00 daily (seconds field first)
      TZ: ${TZ:-Europe/Berlin}
    networks:
      - socket_proxy
      - watchtower_egress # registry checks
    depends_on: [socket-proxy]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M, pids: 64 }
    logging: *small-logs

  # Demo upstreams. Real apps usually live in their own compose project and join
  # their network as `external: true` (README).
  app1:
    image: traefik/whoami:latest
    networks: [caddy_app1]
    deploy: &app-limits
      resources:
        limits: { cpus: "0.5", memory: 64M, pids: 64 }

  app2:
    image: traefik/whoami:latest
    networks: [caddy_app2]
    deploy: *app-limits

networks:
  caddy_egress:
    name: caddy_egress
    # Without IPv6 here, Docker relays IPv6 clients through a proxy and Caddy sees the
    # gateway address for all of them: one shared rate limit, one CrowdSec ban for all.
    enable_ipv6: true
  socket_proxy:
    internal: true # Watchtower <-> proxy only
  watchtower_egress: {}
  # App networks live outside every stack, so Caddy and app stacks start and stop
  # independently. Create once: docker network create --internal caddy_app1
  # (--internal = no internet; give an app that needs it an extra network of its own).
  caddy_app1:
    external: true
  caddy_app2:
    external: true

# Fixed names, no project prefix: same name whatever the directory is called.
volumes:
  caddy-data: { name: caddy-data }
  caddy-config: { name: caddy-config }
  caddy-logs: { name: caddy-logs }
  crowdsec-config: { name: crowdsec-config }
  crowdsec-data: { name: crowdsec-data }
