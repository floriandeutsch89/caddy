# Getting-started stack: Caddy in front of a demo app. Add your upstreams as services.
services:
  caddy:
    image: ghcr.io/floriandeutsch89/caddy:2 # pin a digest in production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data # certificates and ACME account: must persist
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  app:
    image: traefik/whoami:latest

volumes:
  caddy-data:
  caddy-config:
